# Free Supabase databases pause after 7 days without activity, and free Render servers sleep when idle.
# This calls the site's health check (which runs a small database query) twice a week to keep both alive.
name: keep-alive
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site and touch the database
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 60 https://blockquest-academy.onrender.com/api/health; then exit 0; fi
            sleep 30
          done
          exit 1
